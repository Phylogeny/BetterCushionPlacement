description=Cushions can be placed as follows:\n1. Holding `Shift`:\n - Place a cushion horizontally centered on the closest vertex of the block grid.\n - Stack a held cushion on one in the world by interacting with it (if it will have block support).\n2. Holding `Control`:\n - Place a cushion horizontally centered on the closest vertex of the pixel grid.\n3. Holding `Shift` + `Control`:\n - Place a cushion horizontally centered exactly where clicked, completely off-grid.\n4. Holding neither (Vanilla behavior):\n - Place a cushion horizontally centered on the closest block grid tile center.\n\nGame rules:\n- Allow Inner Wall Cushion Placement\n    - ID: bettercushionplacement:allow_inner_wall_cushion_placement\n    - Description: Ignores `#cushion_uses_collision_shape` block tags, thus allowing sub-pixel cushion placement on the inner walls of cauldrons, composters, and hoppers without a data pack.\n    - Default: Disabled\n- Cushions Support Each Other\n    - ID: bettercushionplacement:cushions_support_each_other\n    - Description: Instead of only being supported by blocks, cushions can also be supported by other cushions, allowing direct stacking.\n    - Default: Disabled
